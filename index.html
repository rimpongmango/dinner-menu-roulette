      --accent-2: #ffc65c;

  :root[data-theme="dark"] {
    --page-bg: #150f0c;
    --page-text: #f3e6d8;
    --muted: #b79c86;
    --accent: #ff6a45;

    text-wrap: balance;
    color: var(--page-text);
  }

  .sub {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  /* ---- machine ---- */
  .machine {
    width: 100%;
    background: var(--chassis);
    border-radius: 22px;
    padding: 14px;
    box-shadow:

    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bulb);
    box-shadow: 0 0 6px 2px rgba(255, 207, 110, 0.55);
    animation: twinkle 1.8s ease-in-out infinite;
  }

  .bulbs span:nth-child(odd) { animation-delay: 0.4s; }
  .bulbs span:nth-child(3n) { animation-delay: 0.9s; }

  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; background: var(--bulb-dim); box-shadow: none; }
  }

  .reel-frame {
    position: relative;
    background: var(--window-bg);
    border-radius: 14px;
    padding: 0 14px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.6), inset 0 -3px 10px rgba(0,0,0,0.6);
  }

  .reel-window {
    position: relative;
    height: 372px; /* 5 rows x 74px + line borders wiggle room, adjusted via JS constant */
    overflow: hidden;
  }

  .reel-track {
    will-change: transform;
  }

  .reel-row {
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 18px;
    color: #f3e6d8;
    opacity: 0.45;
  }

  .reel-row .emoji { font-size: 26px; }

  .center-line {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 50%;
    height: 74px;
    transform: translateY(-50%);
    border-top: 2px solid var(--accent-2);
    border-bottom: 2px solid var(--accent-2);
    border-radius: 8px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,198,92,0.10), rgba(255,198,92,0.02));
  }

  .reel-window::before,
  .reel-window::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 110px;
    pointer-events: none;
    z-index: 2;
  }
  .reel-window::before {
    top: 0;
    background: linear-gradient(180deg, var(--window-bg), rgba(18,11,8,0));
  }
  .reel-window::after {
    bottom: 0;
    background: linear-gradient(0deg, var(--window-bg), rgba(18,11,8,0));
  }

  .pointer {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent-2);
    font-size: 16px;
    z-index: 3;
  }
  .pointer.left { left: -2px; }
  .pointer.right { right: -2px; }

  .spin-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 70%);

    font-family: "Jua", "Apple SD Gothic Neo", sans-serif;
    font-size: 23px;
    letter-spacing: 0.04em;

      0 16px 24px -6px rgba(0,0,0,0.45);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(6px);
    box-shadow: 0 4px 0 0 #a3341c, 0 8px 14px -4px rgba(0,0,0,0.45);
  }

  .spin-btn:disabled {
    cursor: default;
    filter: grayscale(0.35) brightness(0.9);
  }

  .spin-btn:focus-visible {
    outline: 3px solid var(--page-text);

    display: flex;
    flex-direction: column;
    gap: 4px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));

    padding: 0 16px;
    opacity: 0;
    overflow: hidden;
    transform: scaleY(0.7);
    transform-origin: top center;

      padding 0.5s ease;

    margin: 0;
    font-family: "Jua", "Apple SD Gothic Neo", sans-serif;
    font-size: 30px;
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: #fff9f0;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

  .card-wrap {
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);

  .card-wrap.show {
    opacity: 1;
    transform: translateY(0);
  }

  .menu-card {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    border-radius: 20px;
    box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.4);

  .card-actions {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  .card-btn {
    flex: 1;
    appearance: none;
    cursor: pointer;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--page-text);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 10px;
    border-radius: 12px;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  .card-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff9f0;
  }

  .card-btn:active { transform: translateY(2px); }

  .card-btn:disabled {
    opacity: 0.55;
    cursor: default;
    transform: none;
  }

  .card-hint {
    margin: 0;
    min-height: 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  details {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 14px;
  }

  summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
  }

  .pool {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 6px 10px;
    font-size: 13px;
  }

  .pool span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (prefers-reduced-motion: reduce) {
    .bulbs span { animation: none; }
    .reel-track { transition-duration: 0.4s !important; }
    .result, .card-wrap { transition-duration: 0.01s !important; }
  }

  .request-box {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .request-btn {
    appearance: none;
    width: 100%;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px dashed var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
  }

  .request-btn:hover { color: var(--accent); border-color: var(--accent-2); }

  .request-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .request-form[hidden] { display: none; }

  .request-form input {
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--page-bg);
    color: var(--page-text);
  }

  .request-form input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .request-save-btn {
    appearance: none;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    background: var(--accent);
    color: #fff;
  }

  .request-save-btn:disabled { opacity: 0.5; cursor: default; }

  .request-msg {
    margin: 0;
    font-size: 12px;
    color: var(--accent);
  }

  footer {
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-top: 4px;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
  }

  footer a:hover { color: var(--accent); }

  .footer-line {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }

  .contact-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 8px;
  }

  .icon-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .icon-link {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 12px;
    line-height: 1;

  .icon-link:hover { transform: translateY(-2px); }

  .icon-mail { background: var(--accent); }
  .icon-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b 55%, #8134af); }
  .icon-youtube { background: #ff0000; }
  .icon-blog { background: #03c75a; }
</style>

  const result = document.getElementById("result");
  const resultName = document.getElementById("resultName");
  const cardWrap = document.getElementById("cardWrap");
  const cardCanvas = document.getElementById("cardCanvas");
  const saveBtn = document.getElementById("saveBtn");
  const shareBtn = document.getElementById("shareBtn");
  const cardHint = document.getElementById("cardHint");

  function rowHTML([name, emoji]) {
    return `<div class="reel-row"><span class="emoji">${emoji}</span><span>${name}</span></div>`;
  }

  let trackHTML = "";
  for (let r = 0; r < REPEATS; r++) {
    for (let i = 0; i < N; i++) trackHTML += rowHTML(menuItems[i]);
  }
  track.innerHTML = trackHTML;

  pool.innerHTML = menuItems
    .map(([name, emoji]) => `<span>${emoji} ${name}</span>`)
    .join("");
  document.getElementById("subCount").textContent = `배달앱 인기 메뉴 + 추천 메뉴, 총 ${N}가지`;
  document.getElementById("poolSummary").textContent = `후보 메뉴 ${N}가지 보기`;

  let currentIndex = CENTER_ROW;
  setPosition(false);

  function setPosition(animated) {
    track.style.transition = animated
      ? "transform 4.4s cubic-bezier(0.11, 0.7, 0.1, 1)"
      : "none";
    track.style.transform = `translateY(${-(currentIndex - CENTER_ROW) * ITEM_H}px)`;
  }

  function highlightCenter() {
    document.querySelectorAll(".reel-row").forEach((el) => (el.style.opacity = "0.45"));
    const centerEl = track.children[currentIndex];
    if (centerEl) centerEl.style.opacity = "1";
  }
  highlightCenter();

  // ---- result card (square, saveable / shareable) ----
  let currentName = "";
  let currentEmoji = "";

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(x, y, w, h, r);
      return;
    }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function fitFontSize(ctx, text, maxWidth, family, weight, startSize, minSize) {
    let size = startSize;
    while (size > minSize) {
      ctx.font = `${weight} ${size}px "${family}", "Apple SD Gothic Neo", sans-serif`;
      if (ctx.measureText(text).width <= maxWidth) break;
      size -= 4;
    }
    return size;
  }

  async function ensureFontsReady() {
    try {
      await Promise.all([
        document.fonts.load('700 64px "Jua"'),
        document.fonts.load('700 26px "Gowun Dodum"'),
        document.fonts.load('400 24px "Gowun Dodum"'),
      ]);
      await document.fonts.ready;
    } catch (e) {
      /* fonts best-effort; canvas falls back to system fonts */
    }
  }

  // kick off once at load so the fonts are already warm by the time a spin
  // finishes, instead of re-awaiting font load on every draw
  const fontsReadyPromise = ensureFontsReady();

  async function drawCard(name, emoji) {
    await fontsReadyPromise;
    const size = 800;
    const ctx = cardCanvas.getContext("2d");
    ctx.clearRect(0, 0, size, size);

    roundRectPath(ctx, 0, 0, size, size, 40);
    ctx.save();
    ctx.clip();

    const bg = ctx.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, "#fdf3e6");
    bg.addColorStop(1, "#f6dfb9");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    const glow = ctx.createRadialGradient(size / 2, size * 0.42, 40, size / 2, size * 0.42, 320);
    glow.addColorStop(0, "rgba(255, 198, 92, 0.35)");
    glow.addColorStop(1, "rgba(255, 198, 92, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = "#e64a2e";
    ctx.lineWidth = 10;
    roundRectPath(ctx, 24, 24, size - 48, size - 48, 32);
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = "#e64a2e";
    ctx.font = '700 28px "Gowun Dodum", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText("오늘 저녁은", size / 2, 150);

    ctx.font = "220px sans-serif";
    ctx.fillText(emoji, size / 2, 430);

    const nameSize = fitFontSize(ctx, name, size - 160, "Jua", 700, 68, 32);
    ctx.fillStyle = "#2a1b12";
    ctx.font = `700 ${nameSize}px "Jua", "Apple SD Gothic Neo", sans-serif`;
    ctx.fillText(name, size / 2, 540);

    const dateStr = new Date().toLocaleDateString("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "long",
    });
    ctx.fillStyle = "#8a6f57";
    ctx.font = '400 24px "Gowun Dodum", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(dateStr, size / 2, size - 92);

    ctx.fillStyle = "#c9a97c";
    ctx.font = '400 18px "Gowun Dodum", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText("저녁 메뉴 뽑기", size / 2, size - 52);

    ctx.restore();
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("toBlob failed"))), "image/png");
    });
  }

  saveBtn.addEventListener("click", async () => {
    cardHint.textContent = "";
    saveBtn.disabled = true;
    try {
      const blob = await canvasToBlob(cardCanvas);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `저녁메뉴_${currentName}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      cardHint.textContent = "저장했어요!";
    } catch (err) {
      cardHint.textContent = "저장에 실패했어요. 이미지를 길게 눌러 저장해보세요.";
    } finally {
      saveBtn.disabled = false;
    }
  });

  shareBtn.addEventListener("click", async () => {
    cardHint.textContent = "";
    shareBtn.disabled = true;
    try {
      const blob = await canvasToBlob(cardCanvas);
      const file = new File([blob], `저녁메뉴_${currentName}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "오늘 저녁 메뉴",
          text: `오늘 저녁은 ${currentEmoji} ${currentName}!`,
        });
      } else {
        throw new Error("share-unsupported");
      }
    } catch (err) {
      if (err && err.name === "AbortError") {
        // user cancelled the share sheet — no message needed
      } else {
        cardHint.textContent = "이 환경에서는 바로 공유가 어려워요. '이미지 저장' 후 카톡·문자에서 사진으로 보내주세요.";
      }
    } finally {
      shareBtn.disabled = false;
    }
  });

  spinBtn.addEventListener("click", () => {
    if (spinBtn.disabled) return;
    spinBtn.disabled = true;
    spinBtn.textContent = "돌리는 중";
    result.classList.remove("open");
    cardWrap.classList.remove("show");
    cardWrap.hidden = true;
    cardHint.textContent = "";

    const targetIndex = Math.floor(Math.random() * N);
    const currentMod = currentIndex % N;
    const delta = (targetIndex - currentMod + N) % N;
    const extraLoops = 8 + Math.floor(Math.random() * 2);
    const newIndex = currentIndex + extraLoops * N + delta;

    currentIndex = newIndex;
    setPosition(true);

    track.addEventListener(
      "transitionend",
      () => {
        highlightCenter();
        currentName = menuItems[targetIndex][0];
        currentEmoji = menuItems[targetIndex][1];
        resultName.textContent = `${currentEmoji} ${currentName}`;
        spinBtn.disabled = false;
        spinBtn.textContent = "한 번 더!";

        // pop the result box open with impact, then draw + fade the card in
        result.classList.add("open");

        drawCard(currentName, currentEmoji).then(() => {
          cardWrap.hidden = false;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => cardWrap.classList.add("show"));
          });
        });

        const reduceBy = Math.floor((currentIndex - CENTER_ROW) / N) * N;
        if (reduceBy > 0) {
          currentIndex -= reduceBy;
          requestAnimationFrame(() => setPosition(false));
        }
      },
      { once: true }
    );
  });

  const requestBtn = document.getElementById("requestBtn");
  const requestForm = document.getElementById("requestForm");
  const requestInput = document.getElementById("requestInput");
  const requestNameInput = document.getElementById("requestNameInput");
  const requestSave = document.getElementById("requestSave");
  const requestMsg = document.getElementById("requestMsg");

  requestBtn.addEventListener("click", () => {
    const opening = requestForm.hidden;
    requestForm.hidden = !opening;
    requestBtn.setAttribute("aria-expanded", String(opening));
    requestBtn.textContent = opening ? "− 메뉴 추가 요청" : "+ 메뉴 추가 요청";
    if (opening) requestInput.focus();
  });

  const REQUEST_FORM_ID = "1FAIpQLSdJpBepUyIkwjwotHnrx2vZ4Xja5V1VIpnT_-xr9ZmiI4k6HQ";
  const REQUEST_ENTRY_ID = "entry.473674839";
  const REQUEST_NAME_ENTRY_ID = "entry.949811308";

  requestSave.addEventListener("click", () => {
    const value = requestInput.value.trim();
    const name = requestNameInput.value.trim();
    if (!value) {
      requestInput.focus();
      return;
    }

    const body = new FormData();
    body.append(REQUEST_ENTRY_ID, value);
    if (REQUEST_NAME_ENTRY_ID && name) body.append(REQUEST_NAME_ENTRY_ID, name);
    fetch(`https://docs.google.com/forms/d/e/${REQUEST_FORM_ID}/formResponse`, {
      method: "POST",
      mode: "no-cors",
      body,
    }).catch(() => {});

    requestInput.value = "";
    requestNameInput.value = "";
    requestMsg.hidden = false;
    setTimeout(() => { requestMsg.hidden = true; }, 3000);
  });

  [requestInput, requestNameInput].forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") requestSave.click();
    });
  });
</script>

</body></html>
